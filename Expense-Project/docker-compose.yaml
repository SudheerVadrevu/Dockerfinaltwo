name: expense
networks:
  default:
    name: sudheer
volumes:
  name: simham

services:
  mysql:
    image: mysql:0.0
    container_name: mysql
    volumes:
      - source: simham
        target: /var/lib/mysql
        type: volumes
  
  backend:
    image: backend:0.0
    container_name: backend
    command: sh -c "sleep 35 && node /opt/server/index.js"
    depends_on:
      - mysql
    ports:
      - 8080:8080
  
  frontend:
    image: frontend:0.0
    container_name: frontend
    depends_on:
      - backend
    ports:
      - 80:80